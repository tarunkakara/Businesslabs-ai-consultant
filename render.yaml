services:
  - type: web
    name: Businesslabs-ai-consultant
    env: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 65
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MOCK_MODE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false

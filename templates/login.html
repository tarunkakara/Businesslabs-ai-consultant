<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AI Tech Consultant Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(3, 7, 18) 90.2%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

    <div class="glass-card w-full max-w-md rounded-2xl p-8 border border-slate-700/60">
        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-500 shadow-lg shadow-indigo-500/25 mb-3">
                <i class="fa-solid fa-brain text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">AI Tech Consultant Suite</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in to access Knowledge Brain & Gmail Agent</p>
        </div>

        <!-- Alert Banner -->
        <div id="login-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

        <!-- Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required value="consultant@businesslabs.ai"
                        class="w-full pl-10 pr-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                        placeholder="you@company.com">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    <a href="#" class="text-xs text-cyan-400 hover:text-cyan-300">Forgot?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required value="consultant123"
                        class="w-full pl-10 pr-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 py-1">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" checked class="rounded border-slate-700 bg-slate-900 text-cyan-500 focus:ring-0">
                    <span>Remember this session</span>
                </label>
                <span class="inline-flex items-center gap-1 text-emerald-400 font-medium">
                    <i class="fa-solid fa-shield-halved text-xs"></i> 256-bit Secure
                </span>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-2.5 px-4 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Consultant Suite
            </button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-800/80 px-2 text-slate-400 rounded">Or Quick Access</span></div>
        </div>

        <button onclick="quickDemoLogin()"
            class="w-full py-2 px-4 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-lg text-xs font-medium text-slate-300 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt text-amber-400"></i> One-Click Demo Access
        </button>

        <div class="mt-6 pt-4 border-t border-slate-800/80 text-center text-xs text-slate-500">
            <span>Powered by AI Tech Consultant Suite</span>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("submit-btn");
            const alertBox = document.getElementById("login-alert");

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

            try {
                const res = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.status === "success") {
                    alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium bg-emerald-500/10 border border-emerald-500/30 text-emerald-400";
                    alertBox.textContent = "Login successful! Redirecting to Knowledge Brain...";
                    alertBox.classList.remove("hidden");
                    setTimeout(() => {
                        const params = new URLSearchParams(window.location.search);
                        const redirect = params.get("redirect") || "/brain";
                        window.location.href = redirect;
                    }, 500);
                } else {
                    throw new Error(data.detail || "Authentication failed");
                }
            } catch (err) {
                alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium bg-rose-500/10 border border-rose-500/30 text-rose-400";
                alertBox.textContent = err.message || "Login failed. Please check credentials.";
                alertBox.classList.remove("hidden");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Consultant Suite';
            }
        }

        function quickDemoLogin() {
            document.getElementById("email").value = "consultant@businesslabs.ai";
            document.getElementById("password").value = "consultant123";
            document.getElementById("login-form").dispatchEvent(new Event("submit"));
        }
    </script>
</body>
</html>
